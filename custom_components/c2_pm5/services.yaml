connect_hrm:
  name: Connect HRM
  description: Connect to a PM5 heart rate monitor.
  fields:
    address:
      name: Device MAC
      description: PM5 Bluetooth MAC address (AA:BB:CC:DD:EE:FF)
      required: true
      selector:
        text:
    manufacturer_id:
      name: Manufacturer ID
      required: true
      selector:
        number:
          min: 0
          max: 255
          mode: box
    device_type:
      name: Device Type
      required: true
      selector:
        select:
          options:
            - Bluetooth
            - ANT+
    belt_id:
      name: Belt ID
      description: 32-bit belt ID (integer)
      required: true
      selector:
        number:
          min: 0
          max: 4294967295
          mode: box

upload_workout:
  name: Upload workout to Garmin
  description: Upload a saved PM5 rowing workout to the selected Garmin Connect account.
  fields:
    workout_id:
      name: Workout ID
      description: Identifier of a workout saved on the Concept2 PM5 status page.
      required: true
      selector:
        text:
    garmin_entity_id:
      name: Garmin account
      description: A Garmin Connect sensor for the destination account. Leave blank to use the monitor default, or the original account when retrying.
      selector:
        entity:
          domain: sensor
          integration: garmin_connect
    retry:
      name: Retry after checking Garmin
      description: Use only after checking that the previous attempt did not create the activity.
      default: false
      selector:
        boolean:
    upload_attempt:
      name: Previous upload attempt
      description: Required when retrying an upload with an uncertain outcome.
      selector:
        number:
          min: 1
          mode: box

keep_workout:
  name: Keep workout locally
  description: Decline Garmin upload and retain the workout and its FIT download in Home Assistant.
  fields:
    workout_id:
      name: Workout ID
      description: Identifier of a workout saved on the Concept2 PM5 status page.
      required: true
      selector:
        text:
