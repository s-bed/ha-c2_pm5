name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  validate-release:
    name: Validate the Marketplace package on Home Assistant 2026.11
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Build the package and release notes
        run: python .github/scripts/build_release.py "$RUNNER_TEMP"
      - name: Install Home Assistant and integration dependencies
        run: >-
          python -m pip install
          aiohasupervisor==0.8.1
          aiousbwatcher==1.1.2
          homeassistant==2026.11.0
          home-assistant-frontend==20261028.4
          garmin-fit-sdk==21.221.0
          bleak==3.0.2
          bleak-retry-connector==4.7.1
          bluetooth-adapters==2.4.0
          bluetooth-auto-recovery==1.6.4
          bluetooth-data-tools==1.29.24
          dbus-fast==5.0.22
          habluetooth==7.1.2
          serialx==1.15.1
      - name: Set up the packaged integration
        run: |
          package_root="$RUNNER_TEMP/pm5-smoke"
          python -m zipfile -e "$RUNNER_TEMP/c2_pm5.zip" "$package_root/custom_components/c2_pm5"
          cd "$package_root"
          python - <<'PY'
          import asyncio
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from types import SimpleNamespace
          from unittest.mock import AsyncMock

          from homeassistant.components import frontend
          from homeassistant.core import HomeAssistant

          from custom_components.c2_pm5 import async_setup, config_flow, sensor

          async def check():
              with TemporaryDirectory() as config_dir:
                  hass = HomeAssistant(config_dir)
                  hass.http = SimpleNamespace(async_register_static_paths=AsyncMock())
                  assert await async_setup(hass, {})
                  assert frontend.async_panel_exists(hass, "concept2-pm5")
                  assert hass.services.has_service("c2_pm5", "upload_workout")
                  hass.http.async_register_static_paths.assert_awaited_once()
                  paths = hass.http.async_register_static_paths.await_args.args[0]
                  assert all(Path(path.path).is_file() for path in paths)

          asyncio.run(check())
          PY

  validate-hassfest:
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Hassfest
        uses: "home-assistant/actions/hassfest@master"
  validate-hacs:
    runs-on: "ubuntu-latest"
    steps:
      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "integration"
          # This fork is installed from a Marketplace link. These checks are for the catalog.
          ignore: "issues topics"
